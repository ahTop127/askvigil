name: Deploy to Oracle Cloud
on:
  push:
    branches:
      - main
      - "iteration-*"
    paths-ignore:
      - ".devcontainer/**"
      - ".gitignore"
      - "README.md"
      - "docs/**"

permissions:
  contents: write # Required to push auto-fixes back to the branch
jobs:
  # Job 1: Lint, block security problems and fix
  lint-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} # Checkout the actual branch for auto-commits

      # --- PYTHON: RUFF & BANDIT ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Tools
        run: pip install ruff bandit

      - name: Security Check (Bandit)
        # Blocks build ONLY on High Severity/High Confidence issues
        run: bandit -r backend -lll -iii

      - name: Auto-Fix & Format (Ruff)
        # Fixes imports/style, ignores errors to allow the next step
        run: |
          ruff check --fix backend || true
          ruff format backend

      # --- REACT: PRETTIER ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Matches frontend/Dockerfile

      - name: Install Prettier
        run: npm install -g prettier

      - name: Format Frontend (Prettier)
        run: npx prettier --write "frontend/**/*.{js,jsx,ts,tsx,css,json,md}"

      # --- AUTO-COMMIT CHANGES ---
      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix formatting & linting [skip ci]"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"

  # Job 2: Auto Deploy
  deploy:
    needs: lint-and-fix
    # Only runs if the branch is 'main' or starts with 'iteration-'
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'iteration-')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. The SSH URL for the repo
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            TARGET_DIR="/home/ubuntu/AskVigil"

            # 2. First-time setup: If the folder doesn't exist, clone it
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "🚀 Initializing private repository..."
              git clone $REPO_URL $TARGET_DIR
            fi

            cd $TARGET_DIR

            # Pause DB
            docker compose stop db backend frontend

            # 3. Git Sync Clean Slate: Fetch latest ver and auto-lint fixes to force the server to match GitHub exactly.
            git remote set-url origin $REPO_URL
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd

            # 4. SELECTIVE CLEANUP: Reclaim space BEFORE building
            # --remove-orphans in step 4 only stops them; it doesn't delete their volumes.
            # This kills any 'zombie' volumes left by previous failed builds.
            docker volume prune -f

            # 5. Deploy and let Docker compose handle the rollout sequence
            echo "🚀 Deploying containers and waiting for health checks..."
            if ! docker compose --env-file .env -f docker-compose.yml up -d --build --remove-orphans --wait; then
              echo "❌ DEPLOYMENT FAILED: One or more health checks failed!"
              echo "⏪ Rolling back to the previous stable commit..."
              
              # Revert the files on the server to the previous commit
              git reset --hard HEAD~1
              
              # Ensure clean slate on rollback too
              docker compose down
              docker compose --env-file .env -f docker-compose.yml up -d --build --remove-orphans
              
              # Capture the failure so we can exit at the very end of the script
              DEPLOYMENT_FAILED=true
            else
              # Force NPM to reload its upstreams cleanly
              # After everything passes health checks, kicking NPM ensures its DNS cache maps to the NEW container IPs
              echo "🔄 Gracefully recycling proxy routing tables..."
              docker compose restart nginx-proxy
            fi

            # 6. POST-DEPLOY HOUSEKEEPING: 
            # This runs now on BOTH success and failure paths!
            # It clears out old images from your successful build, OR the broken images from the failed build.
            echo "🧹 Running post-deploy housekeeping..."
            docker image prune -f

            # 7. Final Exit Status Check for GitHub Actions
            if [ "$DEPLOYMENT_FAILED" = true ]; then
              echo "🔴 Signaling failure to GitHub Actions workflow."
              exit 1
            else
              echo "🟢 Deployment finished successfully!"
            fi
