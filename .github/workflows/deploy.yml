name: Deploy to Oracle Cloud
on:
  push:
    branches: [main]
    paths-ignore:
      - ".devcontainer/**"
      - ".gitignore"
      - "README.md"
      - "docs/**"

permissions:
  contents: write # Required to push auto-fixes back to the branch
jobs:
  # Job 1: Lint, block security problems and fix
  lint-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} # Checkout the actual branch for auto-commits

      # --- PYTHON: RUFF & BANDIT ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Tools
        run: pip install ruff bandit

      - name: Security Check (Bandit)
        # Blocks build ONLY on High Severity/High Confidence issues
        run: bandit -r backend -lll -iii

      - name: Auto-Fix & Format (Ruff)
        # Fixes imports/style, ignores errors to allow the next step
        run: |
          ruff check --fix backend || true
          ruff format backend

      # --- REACT: PRETTIER ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Matches frontend/Dockerfile

      - name: Install Prettier
        run: npm install -g prettier

      - name: Format Frontend (Prettier)
        run: npx prettier --write "frontend/**/*.{js,jsx,ts,tsx,css,json,md}"

      # --- AUTO-COMMIT CHANGES ---
      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix formatting & linting [skip ci]"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"

  # Job 2: Auto Deploy
  deploy:
    needs: lint-and-fix
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. The SSH URL for the repo
            REPO_URL="git@github.com:${{ github.repository }}.git"
            TARGET_DIR="~/AskVigil"

            # 2. First-time setup: If the folder doesn't exist, clone it
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "🚀 Initializing private repository..."
              git clone $REPO_URL $TARGET_DIR
            fi

            cd $TARGET_DIR

            # 3. Clean Slate: Fetch latest ver and auto-lint fixes to force the server to match GitHub exactly.
            git fetch origin main
            git reset --hard origin/main

            # 4. Deploy
            docker compose --env-file .env -f docker-compose.yml up -d --build --remove-orphans
