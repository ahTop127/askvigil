server {
    listen 80;
    # To avoid "413 Request Entity Too Large" error
    client_max_body_size 50M;

    # 1. Serve Static Frontend Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API and Documentation requests to the Backend
    # This regex matches /api, /docs, /redoc, or /openapi.json
    location ~ ^/(api|docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for heavy OCR processing
        proxy_read_timeout 500;
        proxy_connect_timeout 500;
        proxy_send_timeout 500;
    }
}