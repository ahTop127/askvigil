    # 3. Unified Streamlit HTTP & WebSocket Proxy Channel
    location /telemetry {
        proxy_pass http://telemetry:8501;
        
        # Explicitly force protocol upgrades across the entire sub-path
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard Proxy Validation Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering to guarantee live chart updates
        proxy_buffering off;
        proxy_redirect off;
        
        # Prevent timeouts during active live demos
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}