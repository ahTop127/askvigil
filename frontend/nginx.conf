server {
    listen 80;
    # To avoid "413 Request Entity Too Large" error
    client_max_body_size 50M;

    # 1. Serve Static Frontend Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API and Documentation requests to the Backend
    # Added metrics to this regex pool so external scrapers or your dashboard can hit it securely
    location ~ ^/(api|docs|redoc|openapi\.json|metrics) {
        proxy_pass http://backend:8000;
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for heavy OCR processing
        proxy_read_timeout 500;
        proxy_connect_timeout 500;
        proxy_send_timeout 500;
    }

    # 3. Unified Streamlit HTTP & WebSocket Proxy Channel
    location /telemetry {
        proxy_pass http://telemetry:8501;
        
        # Explicitly force protocol upgrades across the entire sub-path
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard Proxy Validation Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Hardcode proto to https so downstream handles secure websockets cleanly
        proxy_set_header X-Forwarded-Proto https;
        
        # Disable buffering to guarantee live chart updates
        proxy_buffering off;
        proxy_redirect off;
        
        # Prevent timeouts during active live demos
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}