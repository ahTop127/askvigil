services:
  # 1. The Database (Using pgvector for AI capability)
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432" # Securely bind to the server's internal localhost only
    restart: always
    shm_size: '1gb'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_SHARED_BUFFERS: 2GB # Tell Postgres to use the RAM you gave it
    volumes:
      - postgres_data:/var/lib/postgresql/data # Named volume (Fast)
      # Keep this as a bind mount because init scripts are "Code" (Infrastructure-as-Code)
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d:ro
    # Cap db resource usage to avoid hanging
    blkio_config:
      device_write_bps:
        - path: /dev/sda
          rate: 10mb
      device_write_iops:
        - path: /dev/sda
          rate: 400
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 6G          # Buffer caching
        reservations:
          memory: 4G
    # Much faster db population, but dangerous (data corruption) if it crashes!
    command: postgres -c fsync=off -c synchronous_commit=off 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. The FastAPI Backend
  backend:
    build: ./backend
      # context: ./backend # Tells Docker the 'root' for this build is the backend folder
      # dockerfile: Dockerfile
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 15s # Gives the API time to spin up before checking
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - asset_data:/app/data_persistence # Named volume (Secure)
      # Note: No more bind mount for app. Must run docker compose up --build backend for changes
      # Links the code/history between repo (host) and app (container) to capture new migrations
      - ./migrations:/app/migrations
    environment:
      ENVIRONMENT: prod
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      OMP_THREAD_LIMIT: 4
      ONNXRUNTIME_INTRA_OP_NUM_THREADS: 4
      ONNXRUNTIME_INTER_OP_NUM_THREADS: 1
      # PYTHONUNBUFFERED: 1
      # We use the 'db' service name as the hostname
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME} # Tortoise needs postgres not postgresql      
      OCI_PAR_URL: ${OCI_PAR_URL} 
      
      MODEL_PATH: /app/data_persistence/ai_models
      PERSISTENCE_PATH: /app/data_persistence
      PYTHONPATH: /app/app  # <--- Forces Python to see 'core' and 'scripts' as top-level
    # Expose 8000 because it's an internal API service.
    expose:
      - "8000"
    deploy:
      resources:
        limits:          
          memory: 16G       # Primary need for RAM
          # No cpu limit here - let it burst to 4.0 if others are idle
        reservations: # Guarantees this amount is always available
          memory: 8G
          cpus: '2.0'  # Guaranteed minimum

  # 3. The React Frontend
  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 15s
    restart: always
    # Expose 80 because NPM needs to talk to this Nginx instance.
    expose:
      - "80" 
    depends_on:
      - backend
    volumes:
      # - ./frontend:/app
      # - /app/node_modules # "Anonymous volume" - hides host node_modules and uses container's
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro # nginx config
    deploy:
      resources:
        limits:
          cpus: '0.5'      
          memory: 1024M       # Frontend doesn't need much

  # 4. Nginx Proxy Manager (SSL/DuckDNS "Manager")
  nginx-proxy:
    image: "jc21/nginx-proxy-manager:latest"
    depends_on:
      frontend:
        condition: service_healthy # Wait for frontend to pass health check
      backend:
        condition: service_healthy # Wait for backend to pass health check
    restart: always
    # Ports needed as the front door to our server.
    ports:
      - "80:80" # Public HTTP
      - "81:81" # Management UI (Used to set up DuckDNS)
      - "443:443" # Public HTTPS
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
      # - ./data_persistence/npm_data:/data
      # - ./data_persistence/npm_letsencrypt:/etc/letsencrypt

  # 5. Discord Bot Microservice
  discord-bot:
    build: ./discord_bot
    restart: always
    depends_on:
      backend:
        condition: service_started # Wait for the backend API route to be live
    environment:
      ENVIRONMENT: prod
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      ASKVIGIL_API_URL: http://backend:8000/api/scan # Internal Docker Network Routing
    deploy:
      resources:
        limits:
          cpus: '0.25'         # Hard-cap compute so it can never hijack main server
          memory: 256M        # Lightweight python baseline

volumes:
  postgres_data:      # Database state
  npm_data:           # Nginx Manager configs
    external: true
  npm_letsencrypt:    # SSL Certificates
    external: true
  asset_data:         # Your ONNX models and CSV datasets


